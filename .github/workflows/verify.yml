name: verify

on:
  push:
  pull_request:

jobs:
  backend:
    # The protected branch requires the pull request check names.
    name: ${{ github.event_name == 'pull_request' && 'backend' || 'backend-push' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vault"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://vault:vault@localhost:5432/vault?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.0"
      - run: make vet fmt-check test cover secrets verify-commerce-config
      - run: make verify-infra
      - run: make test-integration
      - run: go run ./cmd/verify --format json testdata/fixture-package
        working-directory: backend

  mobile-linux:
    name: ${{ github.event_name == 'pull_request' && 'mobile-linux' || 'mobile-linux-push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # No setup-android step: ubuntu-latest runners already ship the
      # Android SDK (ANDROID_SDK_ROOT preset, licenses accepted).
      # android-actions/setup-android@v3 runs `sdkmanager tools`, which
      # no longer exists and fails every mobile-linux run.
      - run: make verify-mobile
