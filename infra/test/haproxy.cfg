global
    maxconn 256
defaults
    mode tcp
    timeout connect 5s
    timeout client 90s
    timeout server 90s
listen postgres
    bind :5432
    server fixture postgres:5432
listen objects
    bind :3900
    server fixture objects:3900
listen smtp
    bind :1025
    server fixture mail:1025
listen mail_api
    bind :8025
    server fixture mail:8025
