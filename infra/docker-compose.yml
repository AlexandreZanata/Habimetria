services:
  postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: vault
      POSTGRES_PASSWORD: vault
      POSTGRES_DB: vault
    ports:
      - "5432:5432"
    volumes:
      # PG18 image stores versioned data under /var/lib/postgresql;
      # mounting /var/lib/postgresql/data breaks boot on 18.6-alpine.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vault -d vault"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  api:
    build:
      context: ../backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      PORT: "8080"
      # Inside compose the defaults point at service names; host runs use
      # infra/.env.example (localhost origins) which matches config.FromEnv.
      DATABASE_URL: ${DATABASE_URL:-postgres://vault:vault@postgres:5432/vault?sslmode=disable}
      VERIFY_BASE_URL: ${VERIFY_BASE_URL:-http://localhost:8080}
      PANEL_ORIGIN: ${PANEL_ORIGIN:-}
      LEGACY_API_MODE: ${LEGACY_API_MODE:-owned}
      COMMERCE_ENV: ${COMMERCE_ENV:-}
      COMMERCE_NEW_PURCHASES_ENABLED: ${COMMERCE_NEW_PURCHASES_ENABLED:-false}
      COMMERCE_SECRETS_DIR: ${COMMERCE_SECRETS_DIR:-/run/secrets/habimetria}
      GOOGLE_PLAY_ENABLED: ${GOOGLE_PLAY_ENABLED:-false}
      GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-}
      GOOGLE_PLAY_SECRET_REF: ${GOOGLE_PLAY_SECRET_REF:-}
      APP_STORE_ENABLED: ${APP_STORE_ENABLED:-false}
      APP_STORE_BUNDLE_ID: ${APP_STORE_BUNDLE_ID:-}
      APP_STORE_APP_ID: ${APP_STORE_APP_ID:-}
      APP_STORE_ISSUER_ID: ${APP_STORE_ISSUER_ID:-}
      APP_STORE_KEY_ID: ${APP_STORE_KEY_ID:-}
      APP_STORE_SECRET_REF: ${APP_STORE_SECRET_REF:-}
      ACCOUNT_MAIL_ENABLED: ${ACCOUNT_MAIL_ENABLED:-false}
      ACCOUNT_MAIL_ORIGIN: ${ACCOUNT_MAIL_ORIGIN:-}
      ACCOUNT_MAIL_SMTP_ADDRESS: ${ACCOUNT_MAIL_SMTP_ADDRESS:-}
      ACCOUNT_MAIL_FROM: ${ACCOUNT_MAIL_FROM:-}
      ACCOUNT_MAIL_SMTP_MODE: ${ACCOUNT_MAIL_SMTP_MODE:-starttls}
      ACCOUNT_MAIL_SMTP_USERNAME: ${ACCOUNT_MAIL_SMTP_USERNAME:-}
      ACCOUNT_MAIL_SMTP_PASSWORD_FILE: ${ACCOUNT_MAIL_SMTP_PASSWORD_FILE:-}
      ACCOUNT_MAIL_PROOF_KEY_FILE: ${ACCOUNT_MAIL_PROOF_KEY_FILE:-}
      STORAGE_BACKEND: s3
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_REGION: us-east-1
      S3_BUCKET: vault
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio12345
      S3_PATH_STYLE: "true"
      HMAC_KEY: ${HMAC_KEY:-dev-only-change-me}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
