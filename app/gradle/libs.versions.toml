[versions]
kotlin = "2.3.10"
compose-multiplatform = "1.11.1"
agp = "8.13.2"
coroutines = "1.10.2"
serialization = "1.8.1"
ktor = "3.0.3"
activity-compose = "1.10.1"
okio = "3.9.0"
camerax = "1.6.0"
work = "2.9.0"
lifecycle = "2.8.7"

[libraries]
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }
camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
lifecycle-process = { module = "androidx.lifecycle:lifecycle-process", version.ref = "lifecycle" }
lifecycle-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
listenablefuture = "com.google.guava:guava:33.3.1-android"
zxing-core = "com.google.zxing:core:3.5.3"
benchmark-macro = "androidx.benchmark:benchmark-macro-junit4:1.3.4"
uiautomator = "androidx.test.uiautomator:uiautomator:2.3.0"
test-junit = "junit:junit:4.13.2"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
baselineprofile = { id = "androidx.baselineprofile", version = "1.3.4" }
